name: CI/CD Pipeline

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v3

            - name: Normaliser le nom du dépôt en minuscules
              run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Connexion au registry GitHub
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Build l'image Docker
              run: |
                  docker build -t ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }} .
                  docker tag ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }} ghcr.io/${{ env.REPO_LOWER }}:latest

            - name: Tester l'image
              run: |
                  docker run -d --name test-app -p 5000:5000 ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
                  sleep 5
                  curl -f http://localhost:5000/health
                  docker stop test-app

            - name: Push l'image
              run: |
                  docker push ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
                  docker push ghcr.io/${{ env.REPO_LOWER }}:latest

            - name: Mettre à jour le tag Helm
              run: |
                  sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|g" helm/myapp/values.yaml
                  git config user.email "github-actions@github.com"
                  git config user.name "GitHub Actions"
                  git add helm/myapp/values.yaml
                  git commit -m "ci: update image tag to ${{ github.sha }} [skip ci]"
                  git push
